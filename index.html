<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Severance — Web Sim</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Severance</h1>
      <div id="mode-bar">
        <button id="btn-story" class="active">Story Mode</button>
        <button id="btn-general">General Mode</button>
      </div>
    </header>
    <div id="console"></div>
    <div id="story-beats"></div>
    <div id="controls">
      <button id="btn-transition">Play Elevator Transition</button>
      <button id="btn-toggle-world">Toggle Innie / Outie world</button>
      <div id="world-label" class="mono"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
